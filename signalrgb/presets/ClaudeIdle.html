<head>
  <title>Claude Idle</title>
  <meta description="Claude Progress: Strefa statusu w kolorze bazowym (brak zadań). Cały komputer w kolorze bazowym."/>
  <meta publisher="Rakasans/claude-progress"/>

  <meta property="baseColor" label="Kolor bazowy (cały komputer)" type="color" default="#ff0000"/>
  <meta property="zoneX" label="Strefa statusu: X" type="number" min="0" max="320" default="0"/>
  <meta property="zoneY" label="Strefa statusu: Y" type="number" min="0" max="200" default="0"/>
  <meta property="zoneW" label="Strefa statusu: szerokość" type="number" min="1" max="320" default="60"/>
  <meta property="zoneH" label="Strefa statusu: wysokość" type="number" min="1" max="200" default="60"/>
</head>

<body style="margin: 0; padding: 0;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas = document.getElementById("exCanvas");
  var ctx = canvas.getContext("2d");
  var PULSE = false;

  function hexToRgb(hex) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function scaled(hex, f) {
    var c = hexToRgb(hex);
    return "rgb(" + Math.round(c.r * f) + "," + Math.round(c.g * f) + "," + Math.round(c.b * f) + ")";
  }

  function update() {
    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var color = baseColor;
    var f = PULSE ? 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Date.now() / 300)) : 1;
    ctx.fillStyle = f === 1 ? color : scaled(color, f);
    ctx.fillRect(Number(zoneX), Number(zoneY), Number(zoneW), Number(zoneH));

    window.requestAnimationFrame(update);
  }

  window.requestAnimationFrame(update);
</script>
