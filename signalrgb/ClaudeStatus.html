<head>
  <title>Claude Status</title>
  <meta description="Cały komputer w kolorze bazowym, a strefa statusu (solo wentylator) pokazuje stan zadań Claude: niebieski — praca, żółty — potrzebna decyzja, zielony — zakończone."/>
  <meta publisher="Rakasans/claude-progress"/>

  <meta property="baseColor" label="Kolor bazowy (cały komputer)" type="color" default="#ff0000"/>
  <meta property="workingColor" label="Praca w toku" type="color" default="#0040ff"/>
  <meta property="inputColor" label="Potrzebna decyzja" type="color" default="#ffbb00"/>
  <meta property="doneColor" label="Zakończone" type="color" default="#00ff20"/>
  <meta property="pulseInput" label="Pulsowanie przy decyzji" type="boolean" default="1"/>

  <meta property="zoneX" label="Strefa statusu: X" type="number" min="0" max="320" default="0"/>
  <meta property="zoneY" label="Strefa statusu: Y" type="number" min="0" max="200" default="0"/>
  <meta property="zoneW" label="Strefa statusu: szerokość" type="number" min="1" max="320" default="60"/>
  <meta property="zoneH" label="Strefa statusu: wysokość" type="number" min="1" max="200" default="60"/>
  <meta property="preview" label="Podgląd (do ustawiania strefy)" type="combobox" values="Wylaczony,Praca,Decyzja,Koniec" default="Wylaczony"/>
</head>

<body style="margin: 0; padding: 0;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas = document.getElementById("exCanvas");
  var ctx = canvas.getContext("2d");

  var SENDER = "claudeprogress";
  // Aplikacja wysyła stan co ~30 s. Bez sygnału przez 3 minuty wracamy do koloru bazowego.
  var STALE_MS = 3 * 60 * 1000;

  var state = "idle";
  var lastEventAt = 0;

  function onCanvasApiEvent(apiEvent) {
    if (apiEvent["sender"] !== SENDER) {
      return;
    }
    var ev = apiEvent["event"];
    if (ev === "working" || ev === "input" || ev === "done" || ev === "idle") {
      state = ev;
      lastEventAt = Date.now();
    }
  }

  function currentState() {
    if (preview === "Praca") return "working";
    if (preview === "Decyzja") return "input";
    if (preview === "Koniec") return "done";
    if (state !== "idle" && Date.now() - lastEventAt > STALE_MS) return "idle";
    return state;
  }

  function hexToRgb(hex) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function scaled(hex, factor) {
    var c = hexToRgb(hex);
    return "rgb(" + Math.round(c.r * factor) + "," + Math.round(c.g * factor) + "," + Math.round(c.b * factor) + ")";
  }

  function update() {
    // Cały komputer: kolor bazowy.
    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Strefa statusu: tu w układzie SignalRGB stoi solo wentylator.
    var s = currentState();
    var color = baseColor;
    var factor = 1;

    if (s === "working") {
      color = workingColor;
    } else if (s === "input") {
      color = inputColor;
      if (pulseInput) {
        factor = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Date.now() / 300));
      }
    } else if (s === "done") {
      color = doneColor;
    }

    ctx.fillStyle = factor === 1 ? color : scaled(color, factor);
    ctx.fillRect(Number(zoneX), Number(zoneY), Number(zoneW), Number(zoneH));

    window.requestAnimationFrame(update);
  }

  window.requestAnimationFrame(update);
</script>
